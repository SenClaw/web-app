name: Release

# Builds the web UI and attaches senclaw-web-dist.tar.gz to a GitHub release.
# This is the asset the daemon downloads (senclaw web / `distrib.rs` in the
# senclaw repo) and the dev fallback used to be a sibling `../web-app/dist`
# checkout — the archive layout must stay a flat dist/ tree (no wrapping
# directory) so both consumers can extract it the same way.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build web dist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack dist
        run: |
          mkdir -p dist-artifacts
          tar -C dist -czf dist-artifacts/senclaw-web-dist.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-web-dist
          path: dist-artifacts/

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: senclaw-web-dist
          path: dist-artifacts

      - name: List artifacts
        run: ls -lh dist-artifacts/

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/senclaw-web-dist.tar.gz
          generate_release_notes: true
